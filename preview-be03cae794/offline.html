<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You’re offline — SipSpot</title>
  <meta name="theme-color" content="#1E88E5">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    :root { --ink: #0d2137; --primary: #1E88E5; --paper: #E3F2FD; --ink-soft: #2c4a63; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      background: var(--paper);
      color: var(--ink);
      padding: 1.5rem;
    }
    main { max-width: 26rem; text-align: center; }
    .mark { width: 72px; height: 72px; margin: 0 auto 1rem; }
    h1 { font-family: Fraunces, Georgia, serif; font-weight: 600; margin: 0 0 0.5rem; color: #0D47A1; }
    p { margin: 0 0 1.25rem; color: var(--ink-soft); line-height: 1.5; }
    a {
      display: inline-flex;
      align-items: center;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      border-radius: 999px;
      padding: 0.7rem 1.15rem;
    }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="18" cy="18" r="18" fill="#1E88E5"/><path d="M18 7.5c-5.2 6.2-7.2 9.4-7.2 12.2a7.2 7.2 0 0 0 14.4 0c0-2.8-2-6-7.2-12.2z" fill="#ffffff"/><path d="M25 11c2.2 1.1 3.4 2.8 3 4.4-1.5-.2-2.8-1-3.6-2.2-.4-1.2-.3-2.2.6-2.2z" fill="#43A047"/></svg>
    <h1>You’re offline</h1>
    <p>SipSpot can’t reach the network just now. Check your connection and try again. Pages you’ve already opened may still be available.</p>
    <a href="./">Back to SipSpot</a>
  </main>
</body>
</html>

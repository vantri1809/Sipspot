<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SipSpot — Coming soon</title>
  <meta name="description" content="SipSpot is coming soon. Find it. Fill it. Go. Free drinking water and bottle-fill points across the UK.">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="SipSpot — Coming soon">
  <meta property="og:description" content="SipSpot is coming soon. Find it. Fill it. Go. Free drinking water and bottle-fill points across the UK.">
  <meta property="og:url" content="https://sipspot.co.uk/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_GB">
  <meta name="theme-color" content="#1E88E5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Source+Sans+3:wght@400;600&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #1E88E5;
      --green: #43A047;
      --bg: #E3F2FD;
      --ink: #123047;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--ink);
      font-family: "Source Sans 3", "Source Sans Pro", "Segoe UI", sans-serif;
      text-align: center;
      padding: 2rem 1.25rem;
    }
    main { max-width: 28rem; }
    .mark {
      width: 72px;
      height: 72px;
      display: block;
      margin: 0 auto 1.25rem;
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 700;
      font-size: 2.4rem;
      letter-spacing: -0.03em;
      margin: 0 0 0.35rem;
      color: var(--blue);
    }
    .tagline {
      margin: 0 0 1.5rem;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--green);
    }
    .soon {
      display: inline-block;
      margin: 0 0 1rem;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    p {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="18" cy="18" r="18" fill="#1E88E5"/>
      <path d="M18 7.5c-5.2 6.2-7.2 9.4-7.2 12.2a7.2 7.2 0 0 0 14.4 0c0-2.8-2-6-7.2-12.2z" fill="#ffffff"/>
      <path d="M25 11c2.2 1.1 3.4 2.8 3 4.4-1.5-.2-2.8-1-3.6-2.2-.4-1.2-.3-2.2.6-2.2z" fill="#43A047"/>
    </svg>
    <h1>SipSpot</h1>
    <p class="tagline">Find it. Fill it. Go.</p>
    <p class="soon">Coming soon</p>
    <p>Free drinking water and bottle-fill points across the UK.</p>
  </main>
</body>
</html>

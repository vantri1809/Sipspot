# SipSpot API: refill counter + Still here / Gone votes.
# Deploy notes are in worker/README.md. Never commit secrets here:
# IP_SALT is set with `wrangler secret put IP_SALT`.
name = "sipspot-api"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false

# Served on its own subdomain so the apex can stay DNS-only to GitHub Pages.
routes = [
  { pattern = "api.sipspot.co.uk", custom_domain = true }
]

[build]
# Bakes the known point ids and point -> city map into the Worker bundle.
command = "python3 ../scripts/build_worker_index.py"
watch_dir = "../data"

[[d1_databases]]
binding = "DB"
database_name = "sipspot-api"
# Created with `wrangler d1 create sipspot-api` (WEUR).
database_id = "259dd053-dc2a-4d59-8aad-6e0d26ba30b7"

[triggers]
# Hourly clean-up of expired throttle keys.
crons = ["17 * * * *"]

[vars]
ALLOWED_ORIGINS = "https://sipspot.co.uk,https://www.sipspot.co.uk,https://vantri1809.github.io"
ALLOW_LOCALHOST = "false"
POINT_COOLDOWN_SECONDS = "7200"
DAILY_CAP = "40"
SITE_URL = "https://sipspot.co.uk"
# Alert emails for managed units ("taken off the map", "check overdue") are
# sent with Resend (resend.com) once these are set. Until then they are only
# logged. Set the API key as a secret: npx wrangler secret put RESEND_API_KEY
# ALERT_FROM = "SipSpot alerts <alerts@sipspot.co.uk>"
# OWNER_ALERT_EMAIL = "hello@sipspot.co.uk"
